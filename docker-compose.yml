# Hermes stack: Ollama (LLM) + Hermes Agent (FastAPI).
# Copy .env.example to .env and set INTERNAL_TOKEN / HERMES_AGENT_TOKEN.
# After `docker compose up -d`, pull a model: docker compose exec hermes-llm ollama pull llama3.2

services:
  hermes-llm:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - hermes_net
    # host:11434 not published by default; other containers use DNS `hermes-llm:11434`

  hermes-agent:
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-change-me}
      HERMES_LLM_BASE_URL: http://hermes-llm:11434/v1
      HERMES_MODEL: ${HERMES_MODEL:-llama3.2}
      REQUIRE_NON_EMPTY_CONTEXT: ${REQUIRE_NON_EMPTY_CONTEXT:-false}
    depends_on:
      - hermes-llm
    networks:
      - hermes_net
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/v1/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  hermes_net:
    driver: bridge

volumes:
  ollama_data:
